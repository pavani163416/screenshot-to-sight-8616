<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pavani Portfolio — Admin Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body {
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #07090d;
      color: #f1f5f9;
    }
    .font-serif {
      font-family: 'Instrument Serif', Georgia, serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .cyber-grid {
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .glass-card {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:hover {
      border-color: rgba(16, 185, 129, 0.3);
    }
    .pulse-glow {
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body class="min-h-screen cyber-grid antialiased selection:bg-emerald-500 selection:text-black">

  <!-- ==================== LOGIN VIEW ==================== -->
  <div id="loginView" class="min-h-screen flex flex-col justify-center items-center px-4 py-12 relative">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
      <!-- Brand Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 mb-4 shadow-lg shadow-emerald-500/10">
          <i data-lucide="shield-check" class="w-7 h-7"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2 font-serif">
          Addepalli Pavani <span class="text-emerald-400 text-xs px-2 py-0.5 rounded-full border border-emerald-500/40 font-mono">Admin</span>
        </h1>
        <p class="text-xs text-slate-400 mt-1 font-mono">
          Project Inquiries & Client Submissions Portal
        </p>
      </div>

      <!-- Card -->
      <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl">
        <div id="loginError" class="hidden mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-xs flex items-start gap-2.5">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-red-400 mt-0.5"></i>
          <span id="loginErrorMessage">Invalid username or password.</span>
        </div>

        <form id="loginForm" class="space-y-5" onsubmit="handleLoginSubmit(event)">
          <div>
            <label class="block text-xs font-mono text-slate-300 mb-1.5">Username or Email</label>
            <div class="relative">
              <i data-lucide="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
              <input
                id="usernameInput"
                type="text"
                required
                placeholder="admin or addepallipavani4@gmail.com"
                class="w-full pl-10 pr-4 py-2.5 bg-black/60 border border-white/10 rounded-xl text-white placeholder:text-slate-600 focus:outline-none focus:border-emerald-400 text-sm font-sans"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-mono text-slate-300 mb-1.5">Password</label>
            <div class="relative">
              <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
              <input
                id="passwordInput"
                type="password"
                required
                placeholder="••••••••"
                class="w-full pl-10 pr-4 py-2.5 bg-black/60 border border-white/10 rounded-xl text-white placeholder:text-slate-600 focus:outline-none focus:border-emerald-400 text-sm font-sans"
              />
            </div>
          </div>

          <!-- API URL selector (collapsed by default) -->
          <div>
            <button
              type="button"
              onclick="toggleApiConfig()"
              class="text-[11px] font-mono text-slate-500 hover:text-slate-300 flex items-center gap-1"
            >
              <i data-lucide="settings" class="w-3 h-3"></i> API Server: <span id="currentApiLabel" class="text-emerald-400/80 underline">Auto-detect</span>
            </button>
            <div id="apiConfigPanel" class="hidden mt-2 p-2.5 bg-black/40 rounded-lg border border-white/10 text-xs">
              <label class="block text-[11px] font-mono text-slate-400 mb-1">Backend URL</label>
              <input
                id="customApiInput"
                type="text"
                value="https://screenshot-to-sight-8616.onrender.com"
                class="w-full px-2.5 py-1.5 bg-zinc-900 border border-white/15 rounded text-slate-200 text-xs font-mono"
              />
            </div>
          </div>

          <button
            type="submit"
            id="loginSubmitBtn"
            class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-black font-semibold text-sm transition-all shadow-lg shadow-emerald-500/20 hover:scale-[1.02] flex items-center justify-center gap-2"
          >
            <span>Sign In to Dashboard</span>
          </button>
        </form>

        <div class="mt-6 pt-5 border-t border-white/5 flex items-center justify-between text-xs text-slate-500">
          <span>Default: <code class="text-emerald-400">admin</code> / <code class="text-emerald-400">admin123</code></span>
          <button
            type="button"
            onclick="autoFillCredentials()"
            class="text-emerald-400 hover:text-emerald-300 underline font-mono text-[11px]"
          >
            Auto-fill
          </button>
        </div>
      </div>

      <div class="text-center mt-6">
        <a href="https://addepallipavani-portfolio.vercel.app" target="_blank" class="text-xs font-mono text-slate-400 hover:text-emerald-400 transition-colors inline-flex items-center gap-1.5">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Open Live Portfolio Website
        </a>
      </div>
    </div>
  </div>

  <!-- ==================== DASHBOARD VIEW ==================== -->
  <div id="dashboardView" class="hidden min-h-screen flex flex-col pb-20">
    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-zinc-950/85 backdrop-blur-md border-b border-white/10 px-4 sm:px-8 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-sm">
          P
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-white flex items-center gap-2 font-serif">
            Addepalli Pavani <span class="text-emerald-400 text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 font-mono">Admin</span>
          </h1>
          <p class="text-[11px] text-slate-400 font-mono hidden sm:block">
            Inquiries Management • MongoDB Atlas
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <a
          href="https://addepallipavani-portfolio.vercel.app"
          target="_blank"
          rel="noreferrer"
          class="hidden sm:inline-flex items-center gap-1.5 text-xs text-slate-300 hover:text-white px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition-colors"
        >
          Live Site <i data-lucide="external-link" class="w-3.5 h-3.5 text-slate-400"></i>
        </a>

        <button
          onclick="handleLogout()"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs bg-red-500/10 hover:bg-red-500/20 text-red-300 border border-red-500/30 hover:border-red-500/50 transition-colors"
        >
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-6">
      <!-- Status Toast -->
      <div id="actionToast" class="hidden p-3.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs flex items-center gap-2">
        <i data-lucide="check-circle-2" class="w-4 h-4 shrink-0"></i>
        <span id="actionToastMessage">Action completed</span>
      </div>

      <!-- Stats Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
        <div class="rounded-2xl p-4 sm:p-5 glass-card shadow-lg">
          <div class="flex items-center justify-between text-slate-400 text-xs font-mono mb-2">
            <span>Total Inquiries</span>
            <i data-lucide="inbox" class="w-4 h-4 text-slate-500"></i>
          </div>
          <div id="statTotal" class="text-2xl sm:text-3xl font-bold text-white font-mono">0</div>
        </div>

        <div class="rounded-2xl p-4 sm:p-5 bg-emerald-950/20 border border-emerald-500/30 shadow-lg">
          <div class="flex items-center justify-between text-emerald-400 text-xs font-mono mb-2">
            <span class="flex items-center gap-1.5">
              <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span> New
            </span>
            <i data-lucide="sparkles" class="w-4 h-4 text-emerald-400"></i>
          </div>
          <div id="statNew" class="text-2xl sm:text-3xl font-bold text-emerald-300 font-mono">0</div>
        </div>

        <div class="rounded-2xl p-4 sm:p-5 bg-sky-950/20 border border-sky-500/30 shadow-lg">
          <div class="flex items-center justify-between text-sky-400 text-xs font-mono mb-2">
            <span>Contacted</span>
            <i data-lucide="mail" class="w-4 h-4 text-sky-400"></i>
          </div>
          <div id="statContacted" class="text-2xl sm:text-3xl font-bold text-sky-300 font-mono">0</div>
        </div>

        <div class="rounded-2xl p-4 sm:p-5 bg-amber-950/20 border border-amber-500/30 shadow-lg">
          <div class="flex items-center justify-between text-amber-400 text-xs font-mono mb-2">
            <span>In Discussion</span>
            <i data-lucide="message-square" class="w-4 h-4 text-amber-400"></i>
          </div>
          <div id="statInDiscussion" class="text-2xl sm:text-3xl font-bold text-amber-300 font-mono">0</div>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="glass-card rounded-2xl p-4 shadow-lg flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
        <div class="relative flex-1">
          <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
          <input
            id="searchInput"
            type="text"
            oninput="handleSearchChange()"
            placeholder="Search by client name, email, phone, or requirements..."
            class="w-full pl-10 pr-4 py-2 bg-black/60 border border-white/10 text-white placeholder:text-slate-500 rounded-xl focus:outline-none focus:border-emerald-400 text-xs sm:text-sm h-10"
          />
        </div>

        <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0">
          <button onclick="setStatusFilter('all')" class="filter-tab px-3 py-1.5 rounded-lg text-xs font-mono capitalize transition-all whitespace-nowrap bg-emerald-500 text-black font-semibold shadow-md shadow-emerald-500/20" data-filter="all">All</button>
          <button onclick="setStatusFilter('new')" class="filter-tab px-3 py-1.5 rounded-lg text-xs font-mono capitalize transition-all whitespace-nowrap bg-white/5 hover:bg-white/10 text-slate-300 border border-white/5" data-filter="new">New</button>
          <button onclick="setStatusFilter('contacted')" class="filter-tab px-3 py-1.5 rounded-lg text-xs font-mono capitalize transition-all whitespace-nowrap bg-white/5 hover:bg-white/10 text-slate-300 border border-white/5" data-filter="contacted">Contacted</button>
          <button onclick="setStatusFilter('in_discussion')" class="filter-tab px-3 py-1.5 rounded-lg text-xs font-mono capitalize transition-all whitespace-nowrap bg-white/5 hover:bg-white/10 text-slate-300 border border-white/5" data-filter="in_discussion">In Discussion</button>
          <button onclick="setStatusFilter('archived')" class="filter-tab px-3 py-1.5 rounded-lg text-xs font-mono capitalize transition-all whitespace-nowrap bg-white/5 hover:bg-white/10 text-slate-300 border border-white/5" data-filter="archived">Archived</button>

          <button
            onclick="fetchInquiries(true)"
            id="refreshBtn"
            class="rounded-lg h-8 px-2.5 bg-white/5 border border-white/10 hover:bg-white/10 text-slate-300 transition-colors flex items-center justify-center"
            title="Refresh Inquiries"
          >
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- Inquiries Container -->
      <div id="inquiriesContainer" class="space-y-4">
        <!-- Dynamically populated -->
      </div>
    </main>
  </div>

  <script>
    // Configuration & State
    const STORAGE_KEY = "pavani_portfolio_admin_token";
    let allInquiries = [];
    let currentFilter = "all";
    let currentSearch = "";

    function getApiBaseUrl() {
      const custom = document.getElementById("customApiInput")?.value?.trim();
      if (custom) return custom.replace(/\/+$/, "");
      if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
        return "http://localhost:5000";
      }
      return "https://screenshot-to-sight-8616.onrender.com";
    }

    function toggleApiConfig() {
      const panel = document.getElementById("apiConfigPanel");
      panel.classList.toggle("hidden");
    }

    function autoFillCredentials() {
      document.getElementById("usernameInput").value = "admin";
      document.getElementById("passwordInput").value = "admin123";
    }

    function showToast(msg) {
      const toast = document.getElementById("actionToast");
      const text = document.getElementById("actionToastMessage");
      text.innerText = msg;
      toast.classList.remove("hidden");
      lucide.createIcons();
      setTimeout(() => {
        toast.classList.add("hidden");
      }, 3500);
    }

    // Auth Helpers
    function getToken() {
      return localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
    }

    function setToken(token) {
      localStorage.setItem(STORAGE_KEY, token);
    }

    function clearToken() {
      localStorage.removeItem(STORAGE_KEY);
      sessionStorage.removeItem(STORAGE_KEY);
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const user = document.getElementById("usernameInput").value.trim();
      const pass = document.getElementById("passwordInput").value;
      const errorBox = document.getElementById("loginError");
      const errorMsg = document.getElementById("loginErrorMessage");
      const btn = document.getElementById("loginSubmitBtn");

      errorBox.classList.add("hidden");
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Signing in...</span>`;
      lucide.createIcons();

      try {
        const baseUrl = getApiBaseUrl();
        const res = await fetch(`${baseUrl}/api/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: user, password: pass }),
        });

        const data = await res.json().catch(() => null);

        if (!res.ok || !data?.success) {
          throw new Error(data?.message || "Invalid credentials. Please try again.");
        }

        setToken(data.token);
        initDashboard();
      } catch (err) {
        errorMsg.innerText = err.message || "Failed to connect to backend service.";
        errorBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In to Dashboard</span>`;
        lucide.createIcons();
      }
    }

    function handleLogout() {
      clearToken();
      document.getElementById("dashboardView").classList.add("hidden");
      document.getElementById("loginView").classList.remove("hidden");
    }

    async function fetchInquiries(isManual = false) {
      const token = getToken();
      if (!token) return handleLogout();

      const refreshBtn = document.getElementById("refreshBtn");
      if (isManual && refreshBtn) {
        refreshBtn.innerHTML = `<i data-lucide="refresh-cw" class="w-3.5 h-3.5 animate-spin text-emerald-400"></i>`;
        lucide.createIcons();
      }

      try {
        const baseUrl = getApiBaseUrl();
        const res = await fetch(`${baseUrl}/api/admin/inquiries`, {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (res.status === 401) {
          handleLogout();
          return;
        }

        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.success) {
          throw new Error(data?.message || "Failed to load inquiries");
        }

        allInquiries = data.data || [];
        updateStats(data.stats || calculateStats(allInquiries));
        renderInquiries();
        if (isManual) showToast("Inquiries refreshed from MongoDB Atlas");
      } catch (err) {
        console.error("Fetch inquiries error:", err);
        showToast(err.message || "Failed to load inquiries");
      } finally {
        if (isManual && refreshBtn) {
          refreshBtn.innerHTML = `<i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>`;
          lucide.createIcons();
        }
      }
    }

    function calculateStats(list) {
      return {
        total: list.length,
        new: list.filter((i) => i.status === "new").length,
        contacted: list.filter((i) => i.status === "contacted").length,
        in_discussion: list.filter((i) => i.status === "in_discussion").length,
        archived: list.filter((i) => i.status === "archived").length,
      };
    }

    function updateStats(stats) {
      document.getElementById("statTotal").innerText = stats.total || 0;
      document.getElementById("statNew").innerText = stats.new || 0;
      document.getElementById("statContacted").innerText = stats.contacted || 0;
      document.getElementById("statInDiscussion").innerText = stats.in_discussion || 0;
    }

    function setStatusFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-tab").forEach((btn) => {
        if (btn.getAttribute("data-filter") === filter) {
          btn.className = "filter-tab px-3 py-1.5 rounded-lg text-xs font-mono capitalize transition-all whitespace-nowrap bg-emerald-500 text-black font-semibold shadow-md shadow-emerald-500/20";
        } else {
          btn.className = "filter-tab px-3 py-1.5 rounded-lg text-xs font-mono capitalize transition-all whitespace-nowrap bg-white/5 hover:bg-white/10 text-slate-300 border border-white/5";
        }
      });
      renderInquiries();
    }

    function handleSearchChange() {
      currentSearch = document.getElementById("searchInput").value.toLowerCase().trim();
      renderInquiries();
    }

    async function changeInquiryStatus(id, newStatus) {
      const token = getToken();
      if (!token) return;

      try {
        const baseUrl = getApiBaseUrl();
        const res = await fetch(`${baseUrl}/api/admin/inquiries/${id}/status`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ status: newStatus }),
        });

        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.success) {
          throw new Error(data?.message || "Failed to update status");
        }

        const item = allInquiries.find((i) => i._id === id);
        if (item) item.status = newStatus;
        updateStats(calculateStats(allInquiries));
        renderInquiries();
        showToast(`Status updated to "${newStatus}"`);
      } catch (err) {
        alert(err.message || "Failed to update status");
      }
    }

    async function deleteInquiry(id, name) {
      if (!confirm(`Are you sure you want to delete inquiry from "${name}"?`)) return;

      const token = getToken();
      if (!token) return;

      try {
        const baseUrl = getApiBaseUrl();
        const res = await fetch(`${baseUrl}/api/admin/inquiries/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });

        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.success) {
          throw new Error(data?.message || "Failed to delete inquiry");
        }

        allInquiries = allInquiries.filter((i) => i._id !== id);
        updateStats(calculateStats(allInquiries));
        renderInquiries();
        showToast(`Deleted inquiry from ${name}`);
      } catch (err) {
        alert(err.message || "Failed to delete inquiry");
      }
    }

    function formatDate(iso) {
      try {
        const d = new Date(iso);
        return new Intl.DateTimeFormat("en-IN", {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        }).format(d);
      } catch {
        return iso;
      }
    }

    function getBadgeClass(status) {
      switch (status) {
        case "new":
          return "bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
        case "contacted":
          return "bg-sky-500/20 text-sky-300 border-sky-500/40";
        case "in_discussion":
          return "bg-amber-500/20 text-amber-300 border-amber-500/40";
        case "archived":
          return "bg-zinc-500/20 text-zinc-400 border-zinc-500/40";
        default:
          return "bg-white/10 text-white border-white/20";
      }
    }

    function renderInquiries() {
      const container = document.getElementById("inquiriesContainer");
      const filtered = allInquiries.filter((item) => {
        if (currentFilter !== "all" && item.status !== currentFilter) return false;
        if (!currentSearch) return true;
        const q = currentSearch;
        return (
          item.name?.toLowerCase().includes(q) ||
          item.email?.toLowerCase().includes(q) ||
          item.phone?.toLowerCase().includes(q) ||
          item.project_type?.toLowerCase().includes(q) ||
          item.message?.toLowerCase().includes(q)
        );
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-12 text-center text-slate-400 rounded-2xl glass-card">
            <i data-lucide="inbox" class="w-10 h-10 mx-auto text-slate-600 mb-3"></i>
            <p class="text-base font-semibold text-slate-200">No inquiries found</p>
            <p class="text-xs text-slate-500 mt-1">
              ${currentSearch || currentFilter !== "all" ? "Try clearing the search query or status filter." : "Client submissions from your portfolio will appear here."}
            </p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = filtered.map((inquiry) => {
        const cleanPhone = inquiry.phone ? inquiry.phone.replace(/[^0-9]/g, "") : "";
        const whatsappLink = cleanPhone ? `https://wa.me/${cleanPhone}` : "";
        const initial = inquiry.name ? inquiry.name.charAt(0).toUpperCase() : "U";

        return `
          <div class="glass-card rounded-2xl p-5 sm:p-6 transition-all space-y-4 shadow-xl">
            <!-- Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-white/5 pb-4">
              <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-full bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-sm">
                  ${initial}
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <h3 class="font-bold text-white text-base">${inquiry.name || "Anonymous Client"}</h3>
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded-full border uppercase tracking-wider ${getBadgeClass(inquiry.status)}">
                      ${(inquiry.status || "new").replace("_", " ")}
                    </span>
                  </div>
                  <div class="flex items-center gap-3 text-xs text-slate-400 mt-0.5 font-mono">
                    <span class="flex items-center gap-1">
                      <i data-lucide="clock" class="w-3 h-3 text-slate-500"></i>
                      ${formatDate(inquiry.createdAt)}
                    </span>
                  </div>
                </div>
              </div>

              <!-- Controls -->
              <div class="flex items-center gap-2 self-end sm:self-auto">
                <select
                  onchange="changeInquiryStatus('${inquiry._id}', this.value)"
                  class="bg-black/60 border border-white/15 text-xs text-slate-200 rounded-lg px-2.5 py-1.5 focus:border-emerald-400 focus:outline-none cursor-pointer font-mono"
                >
                  <option value="new" ${inquiry.status === "new" ? "selected" : ""}>New</option>
                  <option value="contacted" ${inquiry.status === "contacted" ? "selected" : ""}>Contacted</option>
                  <option value="in_discussion" ${inquiry.status === "in_discussion" ? "selected" : ""}>In Discussion</option>
                  <option value="archived" ${inquiry.status === "archived" ? "selected" : ""}>Archived</option>
                </select>

                <button
                  onclick="deleteInquiry('${inquiry._id}', '${(inquiry.name || "Client").replace(/'/g, "\\'")}')"
                  class="h-8 w-8 flex items-center justify-center text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-colors"
                  title="Delete Inquiry"
                >
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- Attributes -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5 text-xs font-mono">
              <div class="flex items-center gap-2 p-2.5 rounded-xl bg-white/[0.03] border border-white/5 truncate">
                <i data-lucide="mail" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i>
                <a href="mailto:${inquiry.email}" class="text-slate-300 hover:text-emerald-400 truncate" title="Email client">
                  ${inquiry.email || "No email"}
                </a>
              </div>

              <div class="flex items-center gap-2 p-2.5 rounded-xl bg-white/[0.03] border border-white/5 truncate">
                <i data-lucide="phone" class="w-3.5 h-3.5 text-sky-400 shrink-0"></i>
                ${whatsappLink ? `
                  <a href="${whatsappLink}" target="_blank" rel="noreferrer" class="text-slate-300 hover:text-emerald-400 truncate flex items-center gap-1" title="Open WhatsApp chat">
                    ${inquiry.phone} <i data-lucide="external-link" class="w-2.5 h-2.5 text-slate-500"></i>
                  </a>
                ` : `<span class="text-slate-500 truncate">No phone</span>`}
              </div>

              <div class="flex items-center gap-2 p-2.5 rounded-xl bg-white/[0.03] border border-white/5 truncate">
                <i data-lucide="folder-kanban" class="w-3.5 h-3.5 text-amber-400 shrink-0"></i>
                <span class="text-slate-300 truncate">${inquiry.project_type || "General Inquiry"}</span>
              </div>

              <div class="flex items-center gap-2 p-2.5 rounded-xl bg-white/[0.03] border border-white/5 truncate">
                <i data-lucide="coins" class="w-3.5 h-3.5 text-teal-400 shrink-0"></i>
                <span class="text-slate-300 truncate">${inquiry.budget_range || "Budget: Unspecified"}</span>
              </div>
            </div>

            <!-- Message Details -->
            <div class="p-3.5 rounded-xl bg-black/50 border border-white/5 text-xs sm:text-sm text-slate-200 leading-relaxed">
              <div class="text-[10px] font-mono text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                <i data-lucide="message-square" class="w-3 h-3 text-emerald-400"></i> Project Details & Message
              </div>
              <p class="whitespace-pre-wrap">${inquiry.message || "No message provided."}</p>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap items-center gap-2 pt-1 text-xs font-mono">
              <a
                href="mailto:${inquiry.email}?subject=Regarding%20your%20project%20inquiry%20(${encodeURIComponent(inquiry.project_type || 'Portfolio')})&body=Hi%20${encodeURIComponent(inquiry.name || 'there')},%0A%0AThank%20you%20for%20reaching%20out.%20I%20reviewed%20your%20project%20requirements%20and%20would%20love%20to%20discuss%20the%20details."
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 transition-colors"
              >
                <i data-lucide="send" class="w-3 h-3"></i> Reply via Email
              </a>

              ${whatsappLink ? `
                <a
                  href="${whatsappLink}"
                  target="_blank"
                  rel="noreferrer"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-green-500/10 hover:bg-green-500/20 text-green-300 border border-green-500/30 transition-colors"
                >
                  <i data-lucide="phone" class="w-3 h-3"></i> Chat on WhatsApp
                </a>
              ` : ""}
            </div>
          </div>
        `;
      }).join("");

      lucide.createIcons();
    }

    function initDashboard() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("dashboardView").classList.remove("hidden");
      lucide.createIcons();
      fetchInquiries();
    }

    // Initialize on page load
    window.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      if (getToken()) {
        initDashboard();
      }
    });
  </script>
</body>
</html>
